<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendário de Frota — BLACK Tools</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --border:rgba(148,163,184,.25);
  --text:#e5e7eb;
  --muted:#9ca3af;

  --green:#22c55e;
  --yellow:#facc15;
  --red:#ef4444;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

.btn{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  cursor:pointer;
}

.btn.active{
  background:#1f2937;
}

/* CALENDAR GRID */
.calendar{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.calendar-header,
.calendar-row{
  display:grid;
  grid-template-columns:160px repeat(7,1fr);
}

.calendar-header{
  background:#020617;
  font-size:13px;
  color:var(--muted);
}

.calendar-header div,
.calendar-row div{
  padding:10px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.calendar-header div:last-child,
.calendar-row div:last-child{
  border-right:none;
}

.label{
  font-weight:600;
}

/* CELLS */
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  border-radius:6px;
}

.cell.green{ background:rgba(34,197,94,.15); color:var(--green); }
.cell.yellow{ background:rgba(250,204,21,.15); color:var(--yellow); }
.cell.red{ background:rgba(239,68,68,.15); color:var(--red); }
</style>
</head>

<body>
<div class="wrap">

  <div class="header">
    <h1>Calendário de Frota</h1>

    <div class="controls">
      <button class="btn">◀</button>
      <strong>Janeiro 2026</strong>
      <button class="btn">▶</button>

      <button class="btn active">Capacidade</button>
      <button class="btn">Por Matrícula</button>
    </div>
  </div>

  <div class="calendar">
    <div class="calendar-header">
      <div></div>
      <div>Seg</div><div>Ter</div><div>Qua</div>
      <div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div>
    </div>

    <!-- LINHA: CAPACIDADE -->
    <div class="calendar-row">
      <div class="label">Frota (3)</div>

      <div><div class="cell green">3 / 3</div></div>
      <div><div class="cell green">3 / 3</div></div>
      <div><div class="cell yellow">1 / 3</div></div>
      <div><div class="cell yellow">1 / 3</div></div>
      <div><div class="cell red">0 / 3</div></div>
      <div><div class="cell green">2 / 3</div></div>
      <div><div class="cell green">3 / 3</div></div>
    </div>

  </div>

</div>
</body>
</html>
